
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5f9">

  <title>My Tasks ♡</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Tasks">
</head>

<body>

  <header class="header">
    <div>
      <p class="sub-title">MY UNIVERSITY LIFE</p>
      <h1>My Tasks <span>♡</span></h1>
    </div>
    <div class="header-icon">🎀</div>
  </header>

  <main>

    <section class="welcome">
      <h2>今日も頑張ろう！</h2>
      <p>あなたの課題を管理しましょう。</p>
    </section>

    <section class="summary">
      <div class="summary-card">
        <p>未完了の課題</p>
        <strong id="task-count">0</strong>
        <span>件</span>
      </div>

      <div class="summary-card">
        <p>予想作業時間</p>
        <strong id="total-estimate">0</strong>
        <span>時間</span>
      </div>
    </section>

    <section class="task-section">
      <div class="section-heading">
        <h2>課題一覧</h2>
        <span>DEADLINE</span>
      </div>

      <div id="task-list"></div>

      <p id="empty-message">
        まだ課題がありません。<br>
        下のボタンから追加しましょう ♡
      </p>
    </section>

    <section class="add-section">
      <h2>新しい課題を追加</h2>

      <form id="task-form">

        <label for="task-name">課題名</label>
        <input
          type="text"
          id="task-name"
          placeholder="例：プログラミング演習"
          required
        >

        <label for="task-subject">科目名</label>
        <input
          type="text"
          id="task-subject"
          placeholder="例：情報処理"
        >

        <label for="task-deadline">提出期限</label>
        <input
          type="datetime-local"
          id="task-deadline"
          required
        >

        <label for="task-estimate">予想所要時間（時間）</label>
        <input
          type="number"
          id="task-estimate"
          min="0"
          max="999"
          step="0.25"
          placeholder="例：2.5"
          required
        >

        <button type="submit" class="add-button">
          ＋ 課題を登録する
        </button>

      </form>
    </section>

  </main>

  <footer>
    <p>My Tasks ♡</p>
    <small>Make your university life better.</small>
  </footer>

  <script src="app.js"></script>

</body>
</html>
